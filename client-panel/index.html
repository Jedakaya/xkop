<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xkop</title>

<!--
  Панель конечного пользователя.

  В ней нет ничего, кроме подписки и выбора маршрута — так решено
  в docs/dashboard.md. Всё остальное живёт в LuCI, и попадать сюда не должно:
  человек, который открыл эту страницу, хочет знать, работает ли интернет
  и куда идёт трафик, а не настраивать резолвер.

  Собирается без сборки: один файл, обычный JavaScript. Панель на роутере
  должна открываться и через десять лет, а не требовать пересборки.
-->

<style>
  :root { color-scheme: light dark; --pad: 16px; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: var(--pad); max-width: 720px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 var(--pad); }
  .card { border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
          border-radius: 10px; padding: var(--pad); margin-bottom: var(--pad); }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  .summary { padding: 12px var(--pad); border-radius: 10px; font-weight: 600;
             margin-bottom: var(--pad); }
  .ok { background: #e6f4ea; color: #1e4620; }
  .warn { background: #fdf0e2; color: #6b3b00; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .muted { opacity: .65; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden;
         margin: 10px 0; background: color-mix(in srgb, currentColor 12%, transparent); }
  .bar i { display: block; }
  .direct { background: #4c8bf5; } .proxy { background: #34a853; } .blocked { background: #ea4335; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px;
          border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
          background: transparent; color: inherit; }
  button { cursor: pointer; }
  button.primary { background: #34a853; color: #fff; border-color: transparent; }
  .field { display: flex; gap: 8px; margin-top: 8px; }
  .field input { flex: 1; min-width: 0; }
  .hidden { display: none; }
  .err { color: #c5221f; }
</style>

<h1>xkop</h1>

<div id="login" class="card">
  <h2>Вход</h2>
  <div class="muted">Пароль роутера.</div>
  <div class="field">
    <input id="password" type="password" autocomplete="current-password">
    <button class="primary" onclick="login()">Войти</button>
  </div>
  <div id="login-error" class="err"></div>
</div>

<div id="app" class="hidden">
  <div id="summary" class="summary warn">загружаю…</div>

  <div class="card">
    <h2>Трафик</h2>
    <div id="bar" class="bar"></div>
    <div id="traffic"></div>
  </div>

  <div class="card">
    <h2>Подписка</h2>
    <div id="subs"></div>
    <div class="field">
      <input id="url" placeholder="https://…" autocomplete="off">
      <button onclick="setSubscription()">Сохранить</button>
    </div>
    <div class="field">
      <button onclick="updateSubscription()">Обновить сейчас</button>
    </div>
  </div>

  <div class="card">
    <h2>Маршрут</h2>
    <div id="routes"></div>
  </div>

  <div class="card">
    <h2>Серверы</h2>
    <div id="nodes"></div>
  </div>

  <div class="card">
    <h2>Почему сайт так работает</h2>
    <div class="field">
      <input id="domain" placeholder="example.com" autocomplete="off">
      <button onclick="explain()">Разобрать</button>
    </div>
    <div id="explain"></div>
  </div>
</div>

<script>
  var token = sessionStorage.getItem("xkop-token") || "";

  function post(path, params) {
    if (location.protocol !== "https:") return Promise.resolve({ ok: false, error: "https_required" });
    var body = Object.keys(params || {}).map(function (k) {
      return k + "=" + encodeURIComponent(params[k]);
    });
    if (token) body.push("token=" + encodeURIComponent(token));
    return fetch("cgi-bin/" + path, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.join("&"),
    }).then(function (r) { return r.json(); });
  }

  function bytes(n) {
    var u = ["Б", "КБ", "МБ", "ГБ", "ТБ"], i = 0;
    n = Number(n) || 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i ? n.toFixed(1) : n) + " " + u[i];
  }

  function el(id) { return document.getElementById(id); }

  // All subscription/RPC values are text, including event arguments.
  function node(tag, className, children) {
    var result = document.createElement(tag);
    if (className) result.className = className;
    (children || []).forEach(function (child) {
      result.appendChild(child instanceof Node ? child : document.createTextNode(String(child == null ? "" : child)));
    });
    return result;
  }

  function row(label, value, className) {
    return node("div", "row " + (className || ""), [node("span", "", [label]), node("span", "", [value])]);
  }

  function login() {
    el("login-error").textContent = "";
    post("auth", { password: el("password").value }).then(function (r) {
      if (!r.ok) {
        el("login-error").textContent = r.error === "too_many_attempts"
          ? "Слишком много попыток, подождите 15 минут"
          : "Неверный пароль";
        return;
      }
      token = r.token;
      sessionStorage.setItem("xkop-token", token);
      el("login").classList.add("hidden");
      el("app").classList.remove("hidden");
      refresh();
    });
  }

  function refresh() {
    post("status", {}).then(function (s) {
      if (!s.ok) { logout(); return; }

      var box = el("summary");
      box.textContent = s.summary;
      box.className = "summary " + (s.summary === "работает" ? "ok" : "warn");

      renderTraffic(s);
      renderSubs(s.subscriptions || []);
      renderNodes(s.nodes || {});
    });
    post("routes", {}).then(renderRoutes);
  }

  function renderTraffic(s) {
    var d = s.distribution;
    el("bar").replaceChildren();
    el("traffic").replaceChildren();
    if (!d) { el("traffic").textContent = "метрики недоступны"; return; }
    var names = { direct: "напрямую", proxy: "через туннель", blocked: "заблокировано" };
    Object.keys(names).forEach(function (k) {
      var value = d[k] || {}, share = Number(value.share) || 0;
      var part = node("i", k);
      part.style.width = Math.max(0, Math.min(100, share * 100)) + "%";
      el("bar").appendChild(part);
      el("traffic").appendChild(row(names[k], bytes(value.bytes) + " · " + Math.round(share * 1000) / 10 + "%"));
    });
    var total = Number(s.total) || 0;
    if (total > 0) el("traffic").appendChild(node("div", "muted", [
      "Всего " + bytes(total) + ". Без распределения весь объём ушёл бы в туннель — сэкономлено " +
      bytes(total - (d.proxy ? d.proxy.bytes : 0)) + "."
    ]));
  }

  function renderSubs(subs) {
    var names = {
      ready: "готова", stale: "устаревает", empty: "пустая",
      rejected: "отвергнута", blocked: "отказ панели", absent: "не задана",
    };
    el("subs").replaceChildren();
    if (!subs.length) el("subs").appendChild(node("div", "muted", ["Подписка не задана"]));
    subs.forEach(function (s) {
      el("subs").appendChild(row(s.id, (names[s.state] || s.state) + " · " + s.servers + " серверов"));
      if (s.announce) el("subs").appendChild(node("div", "muted", [s.announce]));
      if (s.traffic && s.traffic.total > 0) el("subs").appendChild(row("трафик", bytes(s.traffic.used) + " из " + bytes(s.traffic.total), "muted"));
      if (s.traffic && s.traffic.expire > 0) el("subs").appendChild(row("действует до", new Date(s.traffic.expire * 1000).toLocaleDateString(), "muted"));
    });
  }

  function renderRoutes(r) {
    if (!r || !r.ok) return;
    var channels = r.channels || [];
    el("routes").replaceChildren();
    (r.bindings || []).forEach(function (b) {
      var select = node("select");
      channels.forEach(function (c) {
        var label = c.type === "block" ? "блокировать"
          : c.type === "direct" ? "напрямую" : "через туннель";
        var option = node("option", "", [label]);
        option.value = c.id;
        option.selected = c.id === b.channel;
        select.appendChild(option);
      });
      select.onchange = function () { setRoute(b.id, select.value); };
      el("routes").appendChild(row(b.title, select));
    });
    if (!(r.bindings || []).length) el("routes").appendChild(node("div", "muted", ["Привязок нет"]));
  }

  function renderNodes(n) {
    el("nodes").replaceChildren(row("живых", (n.alive || 0) + " из " + (n.total || 0)), row("выбран", n.selected || "автоматически"));
    (n.list || []).forEach(function (x) {
      var state = { alive: "жив", dead: "мёртв", pending: "проверяется", unobserved: "без наблюдения" };
      var button = node("button", "", ["выбрать"]);
      button.onclick = function () { selectNode(x.tag); };
      el("nodes").appendChild(row(x.tag, node("span", "", [
        (state[x.state] || x.state) + (x.delay_ms == null ? "" : " · " + x.delay_ms + " мс") + " ", button
      ])));
    });
    var auto = node("button", "", ["Вернуть автовыбор"]);
    auto.onclick = function () { selectNode("auto"); };
    el("nodes").appendChild(node("div", "field", [auto]));
  }

  function setSubscription() {
    var url = el("url").value.trim();
    if (!url) return;
    post("subscription-set", { url: url }).then(function () { setTimeout(refresh, 2000); });
  }

  function updateSubscription() {
    post("subscription-update", {}).then(refresh);
  }

  function setRoute(binding, channel) {
    post("route-set", { binding: binding, channel: channel }).then(function () {
      setTimeout(refresh, 2000);
    });
  }

  function selectNode(tag) {
    post("node-select", { tag: tag }).then(refresh);
  }

  function explain() {
    var domain = el("domain").value.trim();
    if (!domain) return;
    el("explain").textContent = "спрашиваю…";
    post("explain", { domain: domain }).then(function (r) {
      if (!r.ok) {
        el("explain").replaceChildren(node("div", "err", ["не получилось: " + (r.error || "")]));
        return;
      }
      el("explain").replaceChildren(row("итог", r.role || "неизвестно"));
      if (r.why) el("explain").appendChild(row("почему", r.why));
      if (r.node) el("explain").appendChild(row("узел", r.node.tag));
    });
  }

  function logout() {
    token = "";
    sessionStorage.removeItem("xkop-token");
    el("app").classList.add("hidden");
    el("login").classList.remove("hidden");
  }

  if (location.protocol !== "https:") {
    logout();
    el("password").disabled = true;
    el("login-error").textContent = "Для входа откройте панель по HTTPS с доверенным сертификатом.";
  }
  if (token) {
    el("login").classList.add("hidden");
    el("app").classList.remove("hidden");
    refresh();
  }
  setInterval(function () { if (token) refresh(); }, 15000);
</script>
