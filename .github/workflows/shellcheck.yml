name: Differential ShellCheck

on:
  push:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'xkop/files/usr/bin/**'
      - 'xkop/files/usr/lib/**'
      - 'tools/**'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'xkop/files/usr/bin/**'
      - 'xkop/files/usr/lib/**'
      - 'tools/**'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Differential ShellCheck
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - uses: redhat-plumbers-in-action/differential-shellcheck@v5.5.5
        with:
          severity: error
          include-path: |
            xkop/files/usr/bin/xkop
            xkop/files/usr/lib/xkop/**.sh
            tools/**.sh
          token: ${{ secrets.GITHUB_TOKEN }}
