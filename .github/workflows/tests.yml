name: Tests

on:
  push:
    branches:
      - main
      - 'rc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Show jq version
        run: jq --version

      # The jq OpenWrt installs by default is built without oniguruma, so
      # test/match/gsub/capture do not exist on a router. A program using them
      # passes here and dies there, which is why this is checked and not just
      # remembered.
      - name: No regular expressions in jq programs
        run: |
          if grep -nE '(^|[^a-zA-Z_])(test|match|capture|scan|splits|sub|gsub)\(' \
              xkop/files/usr/lib/xkop/*.jq; then
            echo "jq в OpenWrt собран без oniguruma: эти функции на роутере не существуют"
            exit 1
          fi

      # Правила nft на роутере применяются одним файлом: nft либо принимает
      # весь набор, либо не применяет ничего. Проверять их только строковым
      # сравнением, как делают tests/nft.test.sh, недостаточно — набор может
      # быть «правильным» на вид и отвергнутым разбором. Здесь его читает
      # настоящий nft.
      - name: nftables ruleset parses
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          cat > /tmp/gen.sh <<'SH'
          . xkop/files/usr/lib/xkop/constants.sh
          . xkop/files/usr/lib/xkop/nft.sh
          nft_ruleset "$1" "$2" "$3" "$4"
          SH
          set -e
          for case in "br-lan||0|0" "br-lan eth1|192.168.1.5|0|0" \
                      "br-lan||1|0" "br-lan|192.168.1.5|1|1"; do
            IFS='|' read -r ifaces excl fake ntp <<EOF
          $case
          EOF
            echo "== набор: интерфейсы='$ifaces' исключения='$excl' fakeip=$fake ntp=$ntp"
            sh /tmp/gen.sh "$ifaces" "$excl" "$fake" "$ntp" > /tmp/ruleset.nft
            sudo nft -c -f /tmp/ruleset.nft || {
              echo "nft отверг набор правил"
              cat -n /tmp/ruleset.nft
              exit 1
            }
          done

      # Панель LuCI на роутере не проверить, но синтаксис — можно, и это
      # ловит опечатку раньше, чем она приедет на железо.
      - name: JavaScript syntax
        run: |
          for f in luci-app-xkop/htdocs/luci-static/resources/view/xkop/*.js; do
            node --check "$f"
          done

      # Панель клиента — один файл без сборки: она должна открываться и через
      # десять лет, а не требовать пересборки. Синтаксис её скрипта проверяется
      # тем же способом.
      - name: Panel syntax
        run: |
          python3 - <<'PY'
          import io, re
          html = io.open('client-panel/index.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*)</script>', html, re.S)
          io.open('/tmp/panel.js', 'w', encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/panel.js

      - name: Shell syntax
        run: |
          for f in xkop/files/usr/bin/xkop xkop/files/usr/lib/xkop/*.sh tests/*.sh                    client-panel/cgi-bin/*; do
            sh -n "$f"
          done

      # A stray carriage return turns a shell script into "bad interpreter" on
      # the router, and the repository is edited from Windows.
      - name: No CRLF in shipped files
        run: |
          if grep -rlU $'\r' xkop/ tests/ | grep -v '^$'; then
            echo "найдены файлы с CRLF"
            exit 1
          fi

      # Конфигурацию принимает или отвергает сам движок, а не наши
      # представления о его схеме. Версия та же, что ставит установщик.
      - name: Fetch engine
        run: |
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          # geosite.dat идёт следом за бинарником: правила вида "geosite:xxx"
          # движок разворачивает при загрузке конфигурации, и без файла он
          # отвергает её целиком. На роутере действует то же требование.
          unzip -o -q /tmp/xray.zip xray geosite.dat -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray version | head -n 1

      - name: Run tests
        run: XRAY=/tmp/xray/xray sh tests/run.sh
