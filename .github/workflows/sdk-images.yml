name: SDK images

# The slow half of the build lives in these images: unpacking the SDK and
# updating the feeds. It has nothing to do with xkop sources, so it is not
# repeated on every commit - only when the SDK release itself moves.
#
# Run this once by hand before the first package build, and then only when
# sdk/ changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  sdk:
    name: ${{ matrix.package_type }} SDK ${{ matrix.sdk_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package_type: apk, sdk_version: '25.12.0' }
          - { package_type: ipk, sdk_version: '24.10.8' }
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR отвергает заглавные буквы в имени, а владелец репозитория пишется
      # как есть. Приводим к нижнему регистру, иначе push падает на имени.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./sdk/Dockerfile-sdk-${{ matrix.package_type }}
          context: ./sdk
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/xkop-sdk-${{ matrix.package_type }}:${{ matrix.sdk_version }}
            ghcr.io/${{ steps.owner.outputs.name }}/xkop-sdk-${{ matrix.package_type }}:latest
