name: Build packages

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# Объявленный блок прав ЗАМЕНЯЕТ набор по умолчанию: всё, что здесь не
# перечислено, выдаётся токену как none. Без packages:read сборка падает на
# 403 при попытке забрать готовый образ SDK из GHCR.
permissions:
  contents: write
  packages: read

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "0.$(date +%d%m%Y)")
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package_type }}
    runs-on: ubuntu-latest
    needs: preparation
    strategy:
      fail-fast: false
      matrix:
        # Пока собирается только apk. Ветка ipk готова целиком — Dockerfile-ipk
        # и образ SDK на месте, — и включается одной строкой, когда дойдёт
        # очередь до роутеров на 23 и 24.
        include:
          - { package_type: apk, sdk_version: '25.12.0' }
          # - { package_type: ipk, sdk_version: '24.10.8' }
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # Готовый образ SDK лежит в GHCR и приватен вместе с репозиторием,
      # поэтому за ним нужно логиниться. Собирается он отдельно и редко —
      # см. sdk-images.yml.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Из сборки забирается только каталог с пакетом. Выгружать готовый образ
      # в демон незачем: SDK весит гигабайты, а пакет — килобайты, и именно
      # на этой выгрузке сборка висела дольше, чем считалась.
      - name: Build package
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./Dockerfile-${{ matrix.package_type }}
          context: .
          target: artifacts
          outputs: type=local,dest=./bin/${{ matrix.package_type }}
          build-args: |
            XKOP_VERSION=${{ needs.preparation.outputs.version }}
            SDK_IMAGE=ghcr.io/${{ steps.owner.outputs.name }}/xkop-sdk-${{ matrix.package_type }}:${{ matrix.sdk_version }}

      - name: Check output
        run: |
          ls -l ./bin/${{ matrix.package_type }}
          [ -n "$(ls -A ./bin/${{ matrix.package_type }})" ] || { echo "пакет не собрался"; exit 1; }

      # ipk uses underscores in file names, apk only dashes.
      - name: Normalize ipk file names
        if: matrix.package_type == 'ipk'
        run: |
          for f in ./bin/ipk/*.ipk; do
            [ -e "$f" ] || continue
            mv "$f" "./bin/ipk/$(basename "$f" | tr '_' '-')"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: xkop-${{ needs.preparation.outputs.version }}-${{ matrix.package_type }}
          path: ./bin/${{ matrix.package_type }}/*.${{ matrix.package_type }}
          retention-days: 7
          if-no-files-found: error

  # Релиз выпускается по тегу — как в podkop-forge. Сборка по кнопке кладёт
  # пакет в артефакты и релиза не создаёт: тег нужен только когда меняется
  # содержимое пакета.
  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [preparation, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0

      - run: mkdir -p ./release

      - uses: actions/download-artifact@v4
        with:
          pattern: xkop-*
          merge-multiple: true
          path: ./release

      # Установщик кладётся в релиз рядом с пакетами.
      #
      # raw.githubusercontent отдаёт ветку с пограничного кэша и параметры
      # запроса игнорирует: исправленный установщик уже лежал в репозитории,
      # а роутер шестой раз подряд получал старую копию и падал на той же
      # строке. Файл релиза так подменить нельзя — он привязан к тегу.
      - run: cp install.sh ./release/install.sh

      - uses: softprops/action-gh-release@v2.4.0
        with:
          files: ./release/*.*
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
