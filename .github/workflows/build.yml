name: Build packages

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version for a verification build (without v)'
        required: false
        type: string
      package_type:
        description: 'Package format for a verification build'
        required: false
        default: all
        type: choice
        options: [all, apk, ipk]

# Объявленный блок прав ЗАМЕНЯЕТ набор по умолчанию: всё, что здесь не
# перечислено, выдаётся токену как none. Без packages:read сборка падает на
# 403 при попытке забрать готовый образ SDK из GHCR.
permissions:
  contents: write
  packages: read

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: version
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_FORMAT: ${{ inputs.package_type }}
        run: |
          if [ -n "$BUILD_VERSION" ]; then
            echo "$BUILD_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'
            VERSION=$BUILD_VERSION
          else
            VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "0.$(date +%d%m%Y)")
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$BUILD_FORMAT" in
            apk) MATRIX='[{"package_type":"apk","sdk_version":"25.12.0"}]' ;;
            ipk) MATRIX='[{"package_type":"ipk","sdk_version":"24.10.8"}]' ;;
            ''|all) MATRIX='[{"package_type":"apk","sdk_version":"25.12.0"},{"package_type":"ipk","sdk_version":"24.10.8"}]' ;;
            *) exit 1 ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package_type }}
    runs-on: ubuntu-latest
    needs: preparation
    strategy:
      fail-fast: false
      matrix:
        # Keep both package-manager generations in every release.
        include: ${{ fromJSON(needs.preparation.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # Готовый образ SDK лежит в GHCR и приватен вместе с репозиторием,
      # поэтому за ним нужно логиниться. Собирается он отдельно и редко —
      # см. sdk-images.yml.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Из сборки забирается только каталог с пакетом. Выгружать готовый образ
      # в демон незачем: SDK весит гигабайты, а пакет — килобайты, и именно
      # на этой выгрузке сборка висела дольше, чем считалась.
      - name: Build package
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./Dockerfile-${{ matrix.package_type }}
          context: .
          target: artifacts
          outputs: type=local,dest=./bin/${{ matrix.package_type }}
          build-args: |
            XKOP_VERSION=${{ needs.preparation.outputs.version }}
            SDK_IMAGE=ghcr.io/${{ steps.owner.outputs.name }}/xkop-sdk-${{ matrix.package_type }}:${{ matrix.sdk_version }}

      - name: Check output
        run: |
          ls -l ./bin/${{ matrix.package_type }}
          [ -n "$(ls -A ./bin/${{ matrix.package_type }})" ] || { echo "пакет не собрался"; exit 1; }
          if [ '${{ matrix.package_type }}' = ipk ]; then
            for f in ./bin/ipk/*.ipk; do
              control=$(tar -xzOf "$f" ./control.tar.gz | tar -xzOf - ./control)
              printf '%s\n' "$control" | grep -Fx 'Architecture: all'
              version=$(printf '%s\n' "$control" | sed -n 's/^Version: //p')
              [ "$version" = '${{ needs.preparation.outputs.version }}-1' ] || [ "$version" = '${{ needs.preparation.outputs.version }}-r1' ]
              tar -xzOf "$f" ./data.tar.gz | tar -tzf - > /dev/null
            done
          fi

      # ipk uses underscores in file names, apk only dashes.
      - name: Normalize ipk file names
        if: matrix.package_type == 'ipk'
        run: |
          for f in ./bin/ipk/*.ipk; do
            [ -e "$f" ] || continue
            mv "$f" "./bin/ipk/$(basename "$f" | tr '_' '-')"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: xkop-${{ needs.preparation.outputs.version }}-${{ matrix.package_type }}
          path: ./bin/${{ matrix.package_type }}/*.${{ matrix.package_type }}
          retention-days: 7
          if-no-files-found: error

  # Релиз выпускается по тегу — как в podkop-forge. Сборка по кнопке кладёт
  # пакет в артефакты и релиза не создаёт: тег нужен только когда меняется
  # содержимое пакета.
  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [preparation, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0

      - run: mkdir -p ./release

      - uses: actions/download-artifact@v4
        with:
          pattern: xkop-*
          merge-multiple: true
          path: ./release

      # Установщик кладётся в релиз рядом с пакетами.
      #
      # raw.githubusercontent отдаёт ветку с пограничного кэша и параметры
      # запроса игнорирует: исправленный установщик уже лежал в репозитории,
      # а роутер шестой раз подряд получал старую копию и падал на той же
      # строке. Файл релиза так подменить нельзя — он привязан к тегу.
      - run: cp install.sh ./release/install.sh

      - uses: softprops/action-gh-release@v2.4.0
        with:
          files: ./release/*.*
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
