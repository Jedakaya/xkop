name: Build engine

# Пакет с движком меняется только когда поднимается его версия — раз в
# несколько месяцев. Поэтому отдельный workflow и отдельная кнопка: правка
# скрипта не должна пересобирать одиннадцать пакетов.
# Фильтра по путям здесь быть не должно, хотя он и выглядел уместным.
# Пушей в ветку этот workflow не слушает вовсе, значит фильтр применялся бы
# только к тегам — и релиз, в котором правились скрипты, а не движок, вышел бы
# без пакетов движка. Установщик на таком релизе честно скажет «пакета движка
# нет» и уйдёт ставить файлы с ветки, чего мы как раз и избегаем.
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: read

jobs:
  # Собран ли уже движок этой версии.
  #
  # Тег выпускается на каждую правку скриптов, а версия движка меняется раз
  # в несколько месяцев — пересобирать из-за этого восемь архитектур значит
  # десять минут ждать ровно те же файлы. Если пакеты такой версии уже лежат
  # в каком-то релизе, они переносятся в новый, а сборка пропускается.
  check:
    name: Нужна ли сборка
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.look.outputs.version }}
      have: ${{ steps.look.outputs.have }}
      source: ${{ steps.look.outputs.source }}
    steps:
      - uses: actions/checkout@v5.0.0

      - id: look
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/^PKG_VERSION:=//p' xray-xkop/Makefile | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия движка: $VERSION"

          # Ищем релиз, где такие пакеты уже есть. Сравниваем по имени файла:
          # в него входит и версия, и архитектура — см. build ниже.
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
            --jq "[.[] | select([.assets[].name] | any(startswith(\"xray-xkop-$VERSION-\"))) | .tag_name] | first // empty")

          if [ -n "$SOURCE" ] && [ "$SOURCE" != "$GITHUB_REF_NAME" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
            echo "Уже собран в релизе $SOURCE — пересобирать нечего"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Такой версии в релизах нет, собираю"
          fi

  # Перенос готовых пакетов в новый релиз.
  reuse:
    name: Взять готовые пакеты
    needs: check
    if: needs.check.outputs.have == 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p ./release
          gh release download "${{ needs.check.outputs.source }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "xray-xkop-${{ needs.check.outputs.version }}-*" \
            --dir ./release
          ls -l ./release

          # Релиз создаёт сборка пакетов, и она может ещё идти. Приложить файлы
          # к несуществующему релизу нельзя, поэтому ждём его появления, а
          # не гадаем, кто успеет первым.
          for attempt in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              break
            fi
            echo "релиз $GITHUB_REF_NAME ещё не создан, жду"
            sleep 20
          done

          gh release upload "$GITHUB_REF_NAME" ./release/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  engine:
    name: ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.have != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Архитектуры парка и соседние. Собираются из одного SDK: пакет несёт
        # готовый бинарник, и с роутером должно совпасть описание, а не
        # тулчейн, который его завернул.
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_neon
          - mipsel_24kc
          - mips_24kc
          - x86_64
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build package
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./Dockerfile-engine
          context: .
          target: artifacts
          outputs: type=local,dest=./bin/${{ matrix.arch }}
          build-args: |
            XKOP_TARGET_ARCH=${{ matrix.arch }}
            SDK_IMAGE=ghcr.io/${{ steps.owner.outputs.name }}/xkop-sdk-apk:25.12.0

      # apk не кладёт архитектуру в имя файла, и все восемь пакетов называются
      # одинаково. В релизе они затёрли бы друг друга, а на роутере нельзя
      # понять, тот ли скачался. Архитектура дописывается в имя.
      - name: Check output and name by architecture
        run: |
          ls -l ./bin/${{ matrix.arch }}
          [ -n "$(ls -A ./bin/${{ matrix.arch }})" ] || { echo "пакет не собрался"; exit 1; }
          for f in ./bin/${{ matrix.arch }}/xray-xkop-*; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            base=$(basename "$f" ".$ext")
            mv "$f" "./bin/${{ matrix.arch }}/${base}-${{ matrix.arch }}.${ext}"
          done
          ls -l ./bin/${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: xray-xkop-${{ matrix.arch }}
          path: ./bin/${{ matrix.arch }}/*
          retention-days: 7
          if-no-files-found: error

  # Выкладка — отдельным заданием, как в podkop.
  #
  # Восемь заданий, кладущих файлы в один релиз одновременно, дерутся за него:
  # пакет с архитектурой в имени у каждого свой, а provenance.json — общий,
  # и второй же загрузчик получает already_exists. Здесь загрузка одна.
  release:
    name: Выложить в релиз
    runs-on: ubuntu-latest
    needs: [check, engine]
    if: needs.check.outputs.have != 'true' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all architectures
        uses: actions/download-artifact@v4
        with:
          pattern: xray-xkop-*
          merge-multiple: true
          path: ./release

      - run: ls -l ./release

      # По тегу пакеты движка прикладываются к тому же релизу, что и xkop:
      # установщику нужен один адрес, а не два.
      - uses: softprops/action-gh-release@v2.4.0
        with:
          files: ./release/*
          tag_name: ${{ github.ref_name }}
