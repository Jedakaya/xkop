name: Publish complete release

on:
  workflow_run:
    workflows: [Build packages, Build engine]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Prepare pinned native package inspector
        run: |
          set -eu
          inspector="$RUNNER_TEMP/xkop-apk-inspector"
          mkdir -p "$inspector"
          curl -q -fsSL --proto '=https' --proto-redir '=https' --max-time 60 \
            https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/apk-tools-static-3.0.9-r0.apk \
            -o "$inspector/apk-static.tar.gz"
          printf '%s  %s\n' 677dddb435ca7d621ce9f8a1a404a4cedc631651fd025893c548c34a4ceecb19 \
            "$inspector/apk-static.tar.gz" | sha256sum -c -
          tar -xzf "$inspector/apk-static.tar.gz" -C "$inspector" sbin/apk.static
          echo "APK_TOOL=$inspector/sbin/apk.static" >> "$GITHUB_ENV"
      - name: Test native metadata inspection
        run: python3 tests/release_metadata.py -v
      - name: Verify both builds and complete assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          # A workflow_dispatch verification build must never authorize release.
          for workflow in build.yml build-engine.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > runs.json
            if ! jq -e '.workflow_runs | sort_by(.run_number,.run_attempt) | last | .status == "completed" and .conclusion == "success"' runs.json >/dev/null; then
              echo "Both tag builds have not succeeded yet; leave draft unpublished"
              exit 0
            fi
          done
          ENGINE=$(sed -n 's/^PKG_VERSION:=//p' xray-xkop/Makefile | head -n 1)
          git tag --points-at "$SOURCE_SHA" > tags.txt
          while IFS= read -r tag; do
            case "$tag" in v[0-9]*|[0-9]*) ;; *) continue;; esac
            version=${tag#v}
            printf '%s\n' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || continue
            gh release view "$tag" --json isDraft --jq .isDraft > draft.txt || continue
            [ "$(cat draft.txt)" = true ] || continue
            folder=$(mktemp -d)
            gh release download "$tag" --dir "$folder"
            sh tools/release-complete.sh "$folder" "$version" "$ENGINE"
            gh release upload "$tag" "$folder/release-manifest.json" --clobber
            gh release edit "$tag" --draft=false --latest
            rm -rf "$folder"
          done < tags.txt
